name: Сборка Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Проверить механику игры
        run: node --test test/*.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Подготовить Android SDK
        shell: bash
        run: |
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$sdk/tools.zip"
          echo "2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  $sdk/tools.zip" | sha256sum --check
          unzip -q "$sdk/tools.zip" -d "$sdk"
          "$sdk/cmdline-tools/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0" < <(yes)
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Собрать и проверить подпись APK
        run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: random-life-apk
          path: build/random-life.apk
          if-no-files-found: error
